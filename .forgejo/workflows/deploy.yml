name: Build and deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: docker
    container: ruby:4.0
    steps:
      # Must run first: the ruby image has no node/git, which both the
      # node-based actions below and wrangler need.
      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git nodejs npm

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache bundler gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('Gemfile.lock') }}
          restore-keys: ${{ runner.os }}-gems-

      - name: Install dependencies
        run: |
          bundle config set --local path vendor/bundle
          bundle install --jobs 4

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Install Node (needed by wrangler)
        run: apt-get update -qq && apt-get install -y -qq nodejs npm

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy _site --project-name=personal-website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
