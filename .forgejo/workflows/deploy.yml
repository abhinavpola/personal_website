name: Build and deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: docker
    container: ruby:4.0
    steps:
      # Must run first: the ruby image has no node/git, which both the
      # node-based actions below and wrangler need.
      # Node comes from the official binary tarball because Debian's apt
      # ships an older nodejs than wrangler requires.
      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git curl xz-utils ca-certificates
          curl -fsSL https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz \
            | tar -xJ --strip-components=1 -C /usr/local
          node --version && npm --version

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache bundler gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('Gemfile.lock') }}
          restore-keys: ${{ runner.os }}-gems-

      - name: Install dependencies
        run: |
          bundle config set --local path vendor/bundle
          bundle install --jobs 4

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.125.0 pages deploy _site --project-name=personal-website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
